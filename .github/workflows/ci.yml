name: IngredientIQ CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  # ------------------------------------
  # 1. Detect changed files
  # ------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  # ------------------------------------
  # 2. Frontend checks
  # ------------------------------------
  frontend-checks:
    name: Frontend Checks
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  # ------------------------------------
  # 3. Backend checks
  # ------------------------------------
  backend-checks:
    name: Backend Checks
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        # Live Gemini integration tests require GEMINI_API_KEY and are run separately.
        run: python -m pytest -q -m "not integration"

  # ------------------------------------
  # 4. Dependency and secret scans
  # ------------------------------------
  security-scans:
    name: Dependency and Secret Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements-dev.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------
  # 5. Final CI Gate
  # ------------------------------------
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - frontend-checks
      - backend-checks
      - security-scans

    if: always()

    steps:
      - name: Verify CI results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend-checks.result }}
          BACKEND_RESULT: ${{ needs.backend-checks.result }}
          SECURITY_RESULT: ${{ needs.security-scans.result }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Change detection failed."
            exit 1
          fi

          if [[ "$FRONTEND_CHANGED" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "Frontend checks failed or did not run."
            exit 1
          fi

          if [[ "$BACKEND_CHANGED" == "true" && "$BACKEND_RESULT" != "success" ]]; then
            echo "Backend checks failed or did not run."
            exit 1
          fi

          if [[ "$SECURITY_RESULT" != "success" ]]; then
            echo "Dependency or secret scans failed or did not run."
            exit 1
          fi

          echo "All required CI checks passed."
