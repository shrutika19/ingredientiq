services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      API_REQUESTS_PER_MINUTE: "${API_REQUESTS_PER_MINUTE:-10}"
      API_DAILY_ANALYSES_PER_IP: "${API_DAILY_ANALYSES_PER_IP:-5}"
      API_DAILY_SUBMISSIONS_PER_IP: "${API_DAILY_SUBMISSIONS_PER_IP:-100}"
      API_DAILY_IMAGE_EXTRACTIONS_PER_IP: "${API_DAILY_IMAGE_EXTRACTIONS_PER_IP:-10}"
      TRUSTED_PROXY_IPS: '["172.30.0.0/24"]'
    expose:
      - "8000"
    networks:
      - api_internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migrate:
    build:
      context: ./backend
    env_file:
      - .env
      - ./migration.env
    environment:
      APP_ENV: production
      DEBUG: "false"
    command: ["alembic", "upgrade", "head"]
    networks:
      - api_internal
    restart: "no"

  gateway:
    image: nginx:stable-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - api_internal
    restart: unless-stopped

networks:
  api_internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
